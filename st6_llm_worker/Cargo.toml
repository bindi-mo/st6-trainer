[package]
name = "st6_llm_worker"
version = "0.1.0"
description = "SF6-Trainer LLM worker subprocess (llama.cpp + Named Pipe IPC)"
edition = "2024"

[[bin]]
name = "st6_llm_worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0"
# llama.cpp bindings would go here (e.g., llama-cpp or llama-sys)
# For now, the worker uses a placeholder model interface.

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
