[package]
name = "st6-trainer"
version = "0.1.0"
description = "Street Fighter 6 AI Trainer"
authors = ["Toshiharu Moriyama"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "st6_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
rayon = "1.10"
image = "0.25"
thiserror = "2.0"
rusqlite = { version = "0.31", features = ["bundled"] }
windows = { version = "0.58", features = [
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
] }

# Phase 8: Configuration & model management dependencies
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
dirs-next = "2.0"
handlebars = "4.4"

# Phase 9: LLM worker dependencies
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
predicates = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
